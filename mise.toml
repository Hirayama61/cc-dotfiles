# cc-dotfiles のテスト/静的検査タスク入口。
# 注: chezmoi のソースルートは home/(.chezmoiroot)。この mise.toml と tests/ は
# リポ直下=chezmoi 管理外なので $HOME には展開されない(CI/ローカル検証専用)。
[tools]
# 上流更新で CI が不安定化するため版を固定する(latest に戻さない)。
bats = "1.13.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"

[tasks.test]
description = "bats で hooks/lib を検証(一時 HOME に複製して実行)"
run = "bats --recursive tests"

[tasks.lint]
description = "shellcheck で hooks/lib/skills スクリプトを検査(error レベル)"
run = "shellcheck --severity=error home/dot_claude/hooks/*.sh home/dot_claude/hooks/lib/*.sh home/dot_claude/skills/*/scripts/*.sh"

[tasks.syntax]
description = "構文チェック(hooks/lib + skills のシェルは bash 3.2 / python は compile)"
# bash -n は先頭ファイル引数のみ検査し残りは位置パラメータになるため -n1 で 1 ファイルずつ回す。
# 検査 0 件のまま緑になる経路が 2 つある: find 自体の失敗(mise は set -e 相当だが pipefail は
# 付けないので明示が要る)と、find は成功したが 1 件もマッチしない場合(xargs が何も実行せず
# exit 0)。前者を pipefail、後者を件数ガードで塞ぐ。
# python は compile(..., "exec")。ast.parse は文法しか見ずトップレベル return を素通しする。
# py_compile はリポに __pycache__ を書くため使わない(compile() は書かない)。
run = """
set -o pipefail
sh_n="$(find home/dot_claude/hooks home/dot_claude/skills -name '*.sh' | wc -l | tr -d ' ')"
py_n="$(find home/dot_claude -name '*.py' | wc -l | tr -d ' ')"
[ "$sh_n" -gt 0 ] && [ "$py_n" -gt 0 ] || { echo "検査対象が 0 件(sh=$sh_n py=$py_n)。中断" >&2; exit 1; }
find home/dot_claude/hooks home/dot_claude/skills -name '*.sh' -print0 | xargs -0 -n1 /bin/bash -n --
find home/dot_claude -name '*.py' -print0 | xargs -0 -n1 python3 -c 'import pathlib,sys; p=sys.argv[1]; compile(pathlib.Path(p).read_text(encoding="utf-8"), p, "exec")'
"""

[tasks.check]
description = "test + lint + syntax を一括実行"
depends = ["syntax", "lint", "test"]
